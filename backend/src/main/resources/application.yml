# 仅监听本机，避免无鉴权 API 和开发数据库控制台暴露到局域网。
server:
    address: 127.0.0.1
    port: 8080

spring:
    application:
        name: split-bills

    # 文件数据库路径相对于 backend/ 启动目录。
    datasource:
        url: "jdbc:h2:file:./data/split-bills"
        driver-class-name: org.h2.Driver
        username: sa
        password:
            ""

    # 每次启动都检查 schema.sql；SQL 出错时阻止应用带病启动。
    sql:
        init:
            mode: always
            schema-locations: classpath:schema.sql

    # 控制台只用于本机查看数据库结构和数据。
    h2:
        console:
            enabled: true
            path: /h2-console
